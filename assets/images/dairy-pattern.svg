<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .farm-line { fill: none; stroke: #2D4A32; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.85; }
      .farm-line-gold { fill: none; stroke: #78350F; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.85; }
      .farm-dash { stroke-dasharray: 5, 5; }
      .farm-fill-soft { fill: #2D4A32; fill-opacity: 0.08; }
      .farm-line-thin { fill: none; stroke: #2D4A32; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.75; }
    </style>
  </defs>

  <!-- Rolling Farm Pasture Contour Lines -->
  <path class="farm-line farm-dash" d="M0,90 Q100,65 200,90 T400,90" />
  <path class="farm-line farm-dash" d="M0,300 Q100,275 200,300 T400,300" />

  <!-- Desi Gir Cow with gentle hump, curved horns & calf (Left Center) -->
  <g transform="translate(30, 115) scale(0.78)">
    <!-- Cow Body, hump, head, legs -->
    <path class="farm-line" d="M14,68 C18,48 30,30 48,30 C58,30 64,44 76,44 C98,44 120,50 136,54 C142,56 152,52 160,40 C163,34 171,32 175,40 C177,48 169,64 166,72 C163,84 152,94 136,100 L134,148 L122,148 L120,107 L62,107 L58,148 L48,148 L52,100 C34,100 22,90 17,80 Z" />
    <!-- Horns -->
    <path class="farm-line" d="M160,40 Q156,18 146,10 Q153,16 164,28" />
    <path class="farm-line" d="M171,40 Q177,18 186,10 Q179,16 172,28" />
    <!-- Eye & Ears -->
    <circle cx="166" cy="46" r="1.5" class="farm-fill-soft" />
    <path class="farm-line" d="M152,48 Q144,52 148,58" />
    <!-- Dewlap -->
    <path class="farm-line" d="M140,82 C137,96 128,104 122,107" />
    <!-- Tail with brush -->
    <path class="farm-line" d="M14,68 Q6,95 14,128" />
    <path class="farm-line" d="M14,128 Q10,136 12,144 Q16,138 18,132" />
    <!-- Udder -->
    <path class="farm-line" d="M72,107 Q82,120 92,107" />
  </g>

  <!-- Traditional Woman Churning Ghee with Bilona / Mathani (Top Right) -->
  <g transform="translate(250, 30) scale(0.72)">
    <!-- Woman sitting profile -->
    <path class="farm-line-gold" d="M35,22 C32,12 42,4 52,6 C60,8 64,18 62,26 C60,32 54,34 46,34 Z" />
    <path class="farm-line-gold" d="M36,20 C32,32 30,50 36,66 C40,74 48,80 58,80" />
    <!-- Arms holding bilona rope -->
    <path class="farm-line-gold" d="M44,40 L22,46 L12,48" />
    <path class="farm-line-gold" d="M46,44 L26,52 L14,54" />
    <!-- Churner stick (मथानी) inside matka -->
    <line x1="8" y1="2" x2="8" y2="70" class="farm-line" />
    <line x1="-2" y1="8" x2="18" y2="8" class="farm-line" />
    <!-- Rope loops around stick -->
    <path class="farm-line-gold" d="M8,44 Q14,46 22,46" />
    <path class="farm-line-gold" d="M8,50 Q16,52 26,52" />
    <!-- Traditional Earthen Matka Pot -->
    <ellipse cx="8" cy="70" rx="24" ry="7" class="farm-line" />
    <path class="farm-line" d="M-14,71 L-10,85 C-26,102 -26,128 -10,144 C-2,150 18,150 26,144 C42,128 42,102 26,85 L30,71" />
    <path class="farm-line" d="M-6,104 Q8,110 22,104" />
    <path class="farm-line" d="M-10,122 Q8,130 26,122" />
    <!-- Golden Butter Drops -->
    <circle cx="2" cy="62" r="2" class="farm-line-gold" />
    <circle cx="15" cy="58" r="2" class="farm-line-gold" />
  </g>

  <!-- Traditional Milk Dolchi / Canister (Bottom Right) -->
  <g transform="translate(265, 215) scale(0.75)">
    <!-- Arched Handle -->
    <path class="farm-line" d="M18,24 C18,6 62,6 62,24" />
    <!-- Lid and canister body -->
    <rect x="24" y="24" width="32" height="8" rx="2" class="farm-line" />
    <path class="farm-line" d="M28,32 L20,46 L20,92 C20,96 24,100 28,100 L52,100 C56,100 60,96 60,92 L60,46 L52,32 Z" />
    <line x1="20" y1="64" x2="60" y2="64" class="farm-line" />
    <line x1="20" y1="78" x2="60" y2="78" class="farm-line-thin" />
  </g>

  <!-- Wheat / Crop Stalks (Top Left) -->
  <g transform="translate(45, 22) scale(0.68)">
    <path class="farm-line-gold" d="M25,65 Q25,30 25,0" />
    <path class="farm-line-gold" d="M25,12 Q15,10 13,3 Q21,5 25,12" />
    <path class="farm-line-gold" d="M25,12 Q35,10 37,3 Q29,5 25,12" />
    <path class="farm-line-gold" d="M25,26 Q14,24 11,16 Q21,18 25,26" />
    <path class="farm-line-gold" d="M25,26 Q36,24 39,16 Q29,18 25,26" />
    <path class="farm-line-gold" d="M25,40 Q13,38 10,29 Q21,31 25,40" />
    <path class="farm-line-gold" d="M25,40 Q37,38 40,29 Q29,31 25,40" />
  </g>

  <!-- Lush Village Grass (Bottom Left & Center) -->
  <g transform="translate(25, 330) scale(0.75)">
    <path class="farm-line" d="M10,35 Q18,10 15,0 Q22,12 25,35" />
    <path class="farm-line" d="M25,35 Q35,5 40,0 Q38,15 32,35" />
    <path class="farm-line" d="M32,35 Q44,14 48,6 Q45,20 38,35" />
  </g>
  <g transform="translate(180, 330) scale(0.75)">
    <path class="farm-line" d="M10,35 Q18,10 15,0 Q22,12 25,35" />
    <path class="farm-line" d="M25,35 Q35,5 40,0 Q38,15 32,35" />
  </g>

  <!-- Golden Morning Sun & Rays (Center Top) -->
  <g transform="translate(170, 32) scale(0.65)">
    <circle cx="30" cy="30" r="14" class="farm-line-gold" />
    <line x1="30" y1="6" x2="30" y2="0" class="farm-line-gold" />
    <line x1="30" y1="54" x2="30" y2="60" class="farm-line-gold" />
    <line x1="6" y1="30" x2="0" y2="30" class="farm-line-gold" />
    <line x1="54" y1="30" x2="60" y2="30" class="farm-line-gold" />
    <line x1="13" y1="13" x2="8" y2="8" class="farm-line-gold" />
    <line x1="47" y1="47" x2="52" y2="52" class="farm-line-gold" />
    <line x1="47" y1="13" x2="52" y2="8" class="farm-line-gold" />
    <line x1="13" y1="47" x2="8" y2="52" class="farm-line-gold" />
  </g>
</svg>